<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Lukas' Startseite</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Kopf mit Uhr + Suche, darunter Gruppen als Kachel-Raster; eigene Links ganz unten */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e3e8ee; --fg:#17202b; --muted:#5b6878; --line:#d3dae3;
  --accent:#1f6f78; --accent-fg:#ffffff;
  --c-game:#b86a12; --c-home:#3c7a3a; --c-tool:#2f5fa8; --c-dev:#6b4fa0; --c-note:#8a5a44;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19212b; --surface-2:#222c38; --fg:#e6ebf1; --muted:#93a0b0; --line:#2b3644;
  --accent:#4fb3bb; --accent-fg:#0d1418;
  --c-game:#e7a14f; --c-home:#7cc278; --c-tool:#7ea6eb; --c-dev:#b49bea; --c-note:#d39d82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19212b; --surface-2:#222c38; --fg:#e6ebf1; --muted:#93a0b0; --line:#2b3644;
  --accent:#4fb3bb; --accent-fg:#0d1418;
  --c-game:#e7a14f; --c-home:#7cc278; --c-tool:#7ea6eb; --c-dev:#b49bea; --c-note:#d39d82; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:32px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hello{display:flex;flex-direction:column;gap:2px;min-width:0}
.date{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 .time{color:var(--accent);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{font:inherit;width:min(320px,80vw);padding:10px 40px 10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.btn{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;gap:10px}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.tile{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;min-width:0;transition:transform .12s ease,border-color .12s ease}
.tile:hover{border-color:var(--cat);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--cat);background:color-mix(in srgb,var(--cat) 14%,transparent)}
.pic{flex:none;width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.pic.small{padding:8px}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.name{font-weight:700;font-size:15px}
.desc{color:var(--muted);font-size:13.5px}
.host{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cat);border:1px solid color-mix(in srgb,var(--cat) 40%,transparent);border-radius:999px;padding:0 7px;align-self:flex-start;margin-top:4px}
.del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.del:hover{color:var(--fg);border-color:var(--fg)}

.add{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:8px;background:var(--surface-2);padding:12px;border-radius:var(--r)}
.add input{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
.add input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;margin:0}
.none{color:var(--muted)}
@media (max-width:640px){.add{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="hello">
      <span class="date" id="date">Sonntag, 25. Oktober 2026</span>
      <h1><span id="greet">Hallo Lukas</span> · <span class="time" id="clock">13:45</span></h1>
    </div>
    <div class="tools">
      <label class="search" for="q"><input id="q" type="search" placeholder="Suchen und Enter drücken" autocomplete="off"><kbd>/</kbd></label>
      <button class="btn" id="theme" type="button">Dunkel</button>
    </div>
  </header>

  <main id="groups" style="display:flex;flex-direction:column;gap:32px"></main>

  <section id="own">
    <div class="sec-head"><h2>Eigene Links</h2><span class="count" id="own-count"></span></div>
    <div class="grid" id="own-grid"></div>
    <form class="add" id="add-form">
      <input id="add-name" placeholder="Name, z. B. Wochenplaner" required>
      <input id="add-url" placeholder="Adresse, z. B. https://…" required>
      <input id="add-desc" placeholder="Kurze Beschreibung (optional)">
      <button class="btn primary" type="submit">Hinzufügen</button>
    </form>
    <p class="hint">Eigene Links werden nur in diesem Browser gespeichert. Sag mir Bescheid, wenn ein Link fest auf die Seite soll.</p>
  </section>
</div>

<script>
const GROUPS=[
 {title:"Spiele & Challenges",cat:"--c-game",items:[
  {n:"Overwatch Challenge Hub",d:"Ultimate Hunt, Glücksrad, Hero Ladder, Bingo, Statistiken",u:"https://overwatchchallengehub.netlify.app",m:"OW",i:"icons/overwatch.png"},
  {n:"Game Hub",d:"Scopa, Asse Raus und Tempora",u:"https://thisksad.github.io/Game-Hub/",m:"GH",i:"icons/gamehub.png"},
  {n:"GTA Online Tracker",d:"Business-Timer, Einnahmen, Cayo-Perico-Beute",u:"https://thisksad.github.io/Gta-Online-Tracker/",m:"GTA",i:"icons/gta.png"},
  {n:"Snap Tracker",d:"Marvel-Snap-Matches, Deck- und Karten-Winrates",u:"https://thisksad.github.io/Marvel-Snap-Tracker/",m:"MS",i:"icons/snap.png"},
  {n:"OW Hub Archiv",d:"Alte Version des Challenge Hubs",u:"https://overwatchchallengehub-archiv.netlify.app",m:"AR",i:"icons/overwatch.png",tag:"Archiv"}
 ]},
 {title:"Zuhause",cat:"--c-home",items:[
  {n:"Rezept-Bibliothek",d:"Rezepte aus Reels, mit Mengenfaktor und Kategorien",u:"https://rezeptlibrary.netlify.app",m:"RZ",i:"icons/rezepte.png"},
  {n:"Küken-Teilefinder",d:"BlueBrixx-Teile im Haufen finden",u:"https://claude.ai/code/artifact/465f10d1-afb0-41df-9636-3dcf03801451",m:"KT",i:"https://claude.ai/favicon.ico"}
 ]},
 {title:"Werkzeuge & Notizen",cat:"--c-tool",items:[
  {n:"Bildschirmlineal",d:"Maße direkt am Bildschirm abmessen",u:"https://claude.ai/code/artifact/52139305-28e2-4ba1-a739-f15e997ddc2b",m:"BL",i:"https://claude.ai/favicon.ico"},
  {n:"Portugiesisch",d:"Zusammenfassung vom 22.10.",u:"https://claude.ai/code/artifact/f52ece18-0c4e-4646-bf7b-46d95dd90c27",m:"PT",i:"https://claude.ai/favicon.ico"},
  {n:"Tempora – Regelwerk",d:"Regeln des eigenen Kartenspiels",u:"https://claude.ai/code/artifact/cd94bb40-2e04-4a83-90e3-89476ba2b10b",m:"RW",i:"https://claude.ai/favicon.ico"},
  {n:"Tempora – Kartendesign",d:"Entwürfe für die Karten",u:"https://claude.ai/code/artifact/c74db197-908c-480a-94e8-b418c8b5b9dc",m:"KD",i:"https://claude.ai/favicon.ico"},
  {n:"Alemannia Aachen",d:"Geschichte und Gegenwart",u:"https://claude.ai/code/artifact/5d430d9c-30e8-41ac-b8c5-43d3488929cb",m:"AA",i:"https://claude.ai/favicon.ico"}
 ]},
 {title:"Entwicklung",cat:"--c-dev",items:[
  {n:"GitHub",d:"Alle Repositories von ThisKsad",u:"https://github.com/ThisKsad?tab=repositories",m:"GI",i:"icons/repos.svg"},
  {n:"Netlify",d:"Overwatch Hub, Rezept-Bibliothek",u:"https://app.netlify.com",m:"NL",i:"icons/hosting.svg"},
  {n:"Supabase",d:"Datenbanken aller Projekte",u:"https://supabase.com/dashboard/projects",m:"SB",i:"icons/database.svg"},
  {n:"Claude",d:"Chats und Artefakte",u:"https://claude.ai/code/artifacts",m:"CL",i:"https://claude.ai/favicon.ico"}
 ]}
];

const $=s=>document.querySelector(s);
const store={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let own=store.get("own-links",[]);

function host(u){try{return new URL(u).host.replace(/^www\./,"")}catch(e){return u}}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}

function tile(it,cat,i){
  const a=document.createElement("a");
  a.className="tile";a.href=it.u;a.target="_blank";a.rel="noopener";
  a.style.setProperty("--cat",`var(${cat})`);
  a.dataset.search=(it.n+" "+(it.d||"")+" "+host(it.u)).toLowerCase();
  a.innerHTML=`<span class="mono"></span><span class="txt"><span class="name"></span>${it.d?'<span class="desc"></span>':''}<span class="host"></span>${it.tag?'<span class="tag"></span>':''}</span>`;
  const mono=a.querySelector(".mono");mono.textContent=it.m||initials(it.n);
  if(it.i){const img=document.createElement("img");img.className="pic"+(it.i.endsWith(".ico")?" small":"");img.alt="";img.src=it.i;img.loading="lazy";
    img.addEventListener("error",()=>img.replaceWith(mono));mono.replaceWith(img);}
  a.querySelector(".name").textContent=it.n;
  if(it.d)a.querySelector(".desc").textContent=it.d;
  a.querySelector(".host").textContent=host(it.u);
  if(it.tag)a.querySelector(".tag").textContent=it.tag;
  if(i!==undefined){
    const b=document.createElement("button");b.className="del";b.type="button";b.textContent="×";b.title="Link entfernen";b.setAttribute("aria-label",it.n+" entfernen");
    b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();own.splice(i,1);store.set("own-links",own);renderOwn();applyFilter()});
    a.appendChild(b);
  }
  return a;
}

function renderGroups(){
  const g=$("#groups");g.innerHTML="";
  GROUPS.forEach(gr=>{
    const s=document.createElement("section");s.className="grp";
    s.innerHTML=`<div class="sec-head"><h2></h2><span class="count"></span></div><div class="grid"></div>`;
    s.querySelector("h2").textContent=gr.title;
    s.querySelector(".count").textContent=gr.items.length;
    gr.items.forEach(it=>s.querySelector(".grid").appendChild(tile(it,gr.cat)));
    g.appendChild(s);
  });
}
function renderOwn(){
  const g=$("#own-grid");g.innerHTML="";
  own.forEach((it,i)=>g.appendChild(tile(it,"--c-note",i)));
  $("#own-count").textContent=own.length||"";
  if(!own.length){const p=document.createElement("p");p.className="empty";p.textContent="Noch keine eigenen Links. Unten kannst du welche hinzufügen.";g.appendChild(p)}
}

function applyFilter(){
  const q=$("#q").value.trim().toLowerCase();
  document.querySelectorAll(".tile").forEach(t=>t.hidden=q&&!t.dataset.search.includes(q));
  document.querySelectorAll(".grp").forEach(s=>s.hidden=q&&!s.querySelector(".tile:not([hidden])"));
}
$("#q").addEventListener("input",applyFilter);
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const t=document.querySelector(".tile:not([hidden])");if(t&&$("#q").value.trim())t.click()}
  if(e.key==="Escape"){$("#q").value="";applyFilter();$("#q").blur()}
});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});

$("#add-form").addEventListener("submit",e=>{
  e.preventDefault();
  let u=$("#add-url").value.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;
  own.push({n:$("#add-name").value.trim(),u,d:$("#add-desc").value.trim()});
  store.set("own-links",own);e.target.reset();renderOwn();applyFilter();
});

/* Uhr und Begrüßung */
function tick(){
  const d=new Date(),h=d.getHours();
  $("#clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  $("#date").textContent=d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("#greet").textContent=h<5?"Gute Nacht, Lukas":h<11?"Guten Morgen, Lukas":h<18?"Hallo Lukas":"Guten Abend, Lukas";
}
tick();setInterval(tick,15000);

/* Hell/Dunkel */
const root=document.documentElement;
function isDark(){const t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setLabel(){$("#theme").textContent=isDark()?"Hell":"Dunkel"}
const saved=store.get("theme",null);if(saved)root.setAttribute("data-theme",saved);
$("#theme").addEventListener("click",()=>{const n=isDark()?"light":"dark";root.setAttribute("data-theme",n);store.set("theme",n);setLabel()});
setLabel();

renderGroups();renderOwn();
</script>
</body>
</html>
